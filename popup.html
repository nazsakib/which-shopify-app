<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopify Intelligence Detector</title>
  <style>
    :root {
      --primary: #15C15D;
      --bg-dark: #080A0C;
      --text: #FFFFFF;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --neon-glow: 0 0 15px rgba(21, 193, 93, 0.4);
      --neon-border: 0 0 10px rgba(21, 193, 93, 0.2);
    }

    body { 
      font-family: 'Inter', -apple-system, sans-serif; 
      width: 400px; 
      margin: 0; 
      padding: 0; 
      background: var(--bg-dark); 
      color: var(--text); 
      overflow-x: hidden;
      min-height: 500px;
    }
    
    /* Neon Header */
    header { 
      background: rgba(8, 10, 12, 0.9);
      backdrop-filter: blur(10px);
      padding: 20px; 
      text-align: center;
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    h1 { 
      margin: 0; 
      font-size: 18px; 
      font-weight: 800; 
      letter-spacing: 1px;
      color: var(--primary);
      text-transform: uppercase;
      text-shadow: var(--neon-glow);
    }
    .store-url { 
      font-size: 11px; 
      color: rgba(255, 255, 255, 0.5); 
      margin-top: 6px; 
      font-family: 'Monaco', monospace;
    }
    
    /* Summary Grid with Glassmorphism */
    .summary-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px;
      padding: 20px;
    }
    .sum-item { 
      background: var(--glass-bg);
      backdrop-filter: blur(5px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .sum-item:hover {
      border-color: var(--primary);
      box-shadow: var(--neon-border);
    }
    .sum-val { 
      font-size: 20px; 
      font-weight: 800; 
      color: var(--primary); 
      display: block;
      margin-bottom: 4px;
    }
    .sum-label { 
      font-size: 9px; 
      color: rgba(255, 255, 255, 0.6); 
      text-transform: uppercase; 
      font-weight: 700;
      letter-spacing: 1px;
    }

    .container { padding: 0 20px 20px 20px; }

    /* Section Headers */
    .section-header { 
      display: flex; align-items: center; justify-content: space-between; 
      margin: 24px 0 12px 0; 
      font-size: 11px; font-weight: 800; 
      color: rgba(255, 255, 255, 0.4); 
      text-transform: uppercase; 
      letter-spacing: 2px;
    }
    .badge-count { 
      font-size: 10px; 
      background: var(--glass-bg);
      color: var(--text); 
      padding: 2px 8px; 
      border-radius: 4px;
      border: 1px solid var(--glass-border);
    }
    .badge-count.active { 
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: var(--neon-border);
    }

    /* Modern App Cards */
    .app-list { display: flex; flex-direction: column; gap: 12px; }
    
    @keyframes fadeInUp { 
      from { opacity: 0; transform: translateY(20px); filter: blur(10px); } 
      to { opacity: 1; transform: translateY(0); filter: blur(0); } 
    }
    
    .app-card { 
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border-radius: 14px; 
      padding: 16px; 
      display: flex; 
      align-items: center; 
      gap: 16px; 
      border: 1px solid var(--glass-border);
      opacity: 0; 
      animation: fadeInUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .app-card:hover {
      transform: scale(1.02);
      border-color: rgba(21, 193, 147, 0.3);
    }
    
    .app-icon { 
      width: 44px; 
      height: 44px; 
      background: linear-gradient(135deg, var(--primary), #0a8e44);
      color: var(--bg-dark); 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 900; 
      font-size: 20px; 
      flex-shrink: 0;
      box-shadow: var(--neon-glow);
    }
    .app-details { flex-grow: 1; }
    .app-name { 
      font-size: 15px; 
      font-weight: 700; 
      color: var(--text); 
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .app-meta { font-size: 11px; color: rgba(255, 255, 255, 0.5); display: flex; gap: 10px; align-items: center; }
    
    .tag { 
      font-size: 9px; 
      font-weight: 800; 
      padding: 2px 8px; 
      border-radius: 6px; 
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
    }
    .tag.active { 
      color: var(--primary); 
      background: rgba(21, 193, 93, 0.1);
      border: 1px solid rgba(21, 193, 93, 0.3);
    }

    /* Empty/Loader States */
    .empty { 
      padding: 30px; 
      text-align: center; 
      color: rgba(255, 255, 255, 0.3); 
      font-size: 12px; 
      border: 1px dashed var(--glass-border); 
      border-radius: 14px;
      background: var(--glass-bg);
    }

    .rescan-loading { text-align: center; padding: 60px 0; color: var(--primary); }
    .spinner { 
      width: 30px; 
      height: 30px; 
      border: 3px solid rgba(21, 193, 93, 0.1); 
      border-top-color: var(--primary); 
      border-radius: 50%; 
      animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite; 
      display: inline-block; 
      margin-bottom: 15px;
      box-shadow: var(--neon-border);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Neon Button Footer */
    .footer { 
      padding: 20px; 
      background: rgba(8, 10, 12, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--glass-border);
      position: sticky;
      bottom: 0;
    }
    button#rescan-btn { 
      width: 100%;
      padding: 14px; 
      border-radius: 12px; 
      font-size: 14px; 
      font-weight: 800; 
      cursor: pointer; 
      background: var(--primary); 
      color: var(--bg-dark); 
      border: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: var(--neon-glow);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    button#rescan-btn:hover { 
      transform: scale(1.02) translateY(-2px);
      box-shadow: 0 0 25px rgba(21, 193, 93, 0.6);
    }
    button#rescan-btn:active { transform: scale(0.98); }
    button#rescan-btn:disabled { 
      background: #2a2a2a; 
      color: #666; 
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>Shopify Intelligence</h1>
    <div class="store-url" id="store-domain">analyzing node...</div>
  </header>
  
  <div class="summary-grid">
    <div class="sum-item">
      <span class="sum-val" id="active-count">0</span>
      <span class="sum-label">Active Apps</span>
    </div>
    <div class="sum-item">
      <span class="sum-val" id="theme-name">...</span>
      <span class="sum-label">Store Theme</span>
    </div>
  </div>

  <div class="container">
    <div class="section-header">
      <span>Active Intelligence</span>
      <span class="badge-count active" id="badge-active">0</span>
    </div>
    <div class="app-list" id="list-active"></div>

    <div class="section-header">
      <span>App Components</span>
      <span class="badge-count" id="badge-scripts">0</span>
    </div>
    <div class="app-list" id="list-scripts"></div>

    <div class="section-header">
      <span>Code Traces</span>
      <span class="badge-count" id="badge-ghosts">0</span>
    </div>
    <div class="app-list" id="list-ghosts"></div>
  </div>

  <div class="footer">
    <button id="rescan-btn">Re-initialize Scan</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
